    title: Sweep + displacement adds information
    type: I
    rank: 5
    norm: atr
    primary: {metric: r12, control: B002 events without displacement}
    twin: null
    params: {}
    expected: "~ 0; P ~ 0.15"
  B010:
    hypothesis: HB06
