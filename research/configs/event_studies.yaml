    twin: null
    params: {every_bars: 6, window: *rth_window}
    expected: "slope ~ 0 after trend control; P ~ 0.05"
  B016:
    hypothesis: HB11
    title: OTE band vs 0.50-0.62 band
    type: I
    rank: 11
    norm: atr
    primary: {metric: r12, control: "[0.50, 0.62) band entries"}
    twin: null
    params: {bands: {b38: [0.38, 0.50], b50: [0.50, 0.62], ote: [0.62, 0.79]}, max_bars: 24, window: *rth_window}
    expected: "no Fibonacci peak; P ~ 0.05"
  B017:
