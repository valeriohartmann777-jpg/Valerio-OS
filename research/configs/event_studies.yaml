    twin: null
    params: {min_width_atr: 0.25, formed: ["09:45", "14:30"], fill_bars: 12, window: *rth_window}
    expected: "fill rate > 0.6 for both; difference ~ 0; P ~ 0.10"
  B013:
    hypothesis: HB09
