    twin: primary
    params: {min_width_atr: 0.25, formed: ["09:45", "14:30"], max_bars: 60, window: *rth_window}
    expected: "~ 0; P ~ 0.10"
  B014:
    hypothesis: HB10
    title: Order-block retest -> reaction
    type: E
    rank: 14
    norm: atr
    primary: {metric: r12, control: random_depth_twin}
    twin: primary
