    params: {pen_atr: 0.10, reclaim_bars: 3, window: *rth_window, max_age_bars: 300}
    expected: "difference ~ 0; P ~ 0.10"
  B008:
    hypothesis: HB04
    title: Liquidity run - clean break that holds -> continuation
    type: E
    rank: 3
    norm: atr
    primary: {metric: r12, control: time_matched}
    twin: same detector on shifted-reference levels
    params: {thr_atr: 0.10, hold_bars: 3, window: *rth_window}
    expected: "+0.00 to +0.06 ATR; P ~ 0.20"
  B009:
