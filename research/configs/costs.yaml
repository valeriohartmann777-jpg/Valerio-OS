    LOW:    {commission_rt: 3.50, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 0.5, slippage_ticks_stop: 1.0, slippage_ticks_limit: 0, eth_slippage_mult: 1.5, limit_through_ticks: 0}
    BASE:   {commission_rt: 4.80, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 1.0, slippage_ticks_stop: 2.0, slippage_ticks_limit: 0, eth_slippage_mult: 2.0, limit_through_ticks: 1}
    STRESS: {commission_rt: 6.50, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 2.0, slippage_ticks_stop: 4.0, slippage_ticks_limit: 0, eth_slippage_mult: 2.0, limit_through_ticks: 2}
  GC:
    LOW:    {commission_rt: 3.50, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 0.5, slippage_ticks_stop: 1.0, slippage_ticks_limit: 0, eth_slippage_mult: 1.5, limit_through_ticks: 0}
    BASE:   {commission_rt: 4.80, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 1.0, slippage_ticks_stop: 2.0, slippage_ticks_limit: 0, eth_slippage_mult: 2.0, limit_through_ticks: 1}
    STRESS: {commission_rt: 6.50, fee_bps_taker: 0, fee_bps_maker: 0, slippage_ticks_market: 2.0, slippage_ticks_stop: 4.0, slippage_ticks_limit: 0, eth_slippage_mult: 2.0, limit_through_ticks: 2}
  BTCUSDT_PERP:
    # Binance USD-M regular tier: taker 0.050%, maker 0.020% per side. Funding is ignored for
    # intraday trades (documented limitation; |funding| is usually <= 0.01% per 8h).
    LOW:    {commission_rt: 0, fee_bps_taker: 4.0, fee_bps_maker: 1.8, slippage_ticks_market: 2.0, slippage_ticks_stop: 5.0, slippage_ticks_limit: 0, eth_slippage_mult: 1.0, limit_through_ticks: 0}
