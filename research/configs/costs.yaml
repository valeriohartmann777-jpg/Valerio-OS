    STRESS: {commission_rt: 0, fee_bps_taker: 6.0, fee_bps_maker: 2.0, slippage_ticks_market: 10.0, slippage_ticks_stop: 30.0, slippage_ticks_limit: 0, eth_slippage_mult: 1.0, limit_through_ticks: 2}
