[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS backend: orchestration, tools, permissions, events."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "psutil>=6.0",
  "anthropic>=1.11",
  "pypdf>=5.0",
  "httpx2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=15",
  "onnxruntime>=1.18",
  "databento==0.87.0",
  "keyring>=25.6",
  "exchange_calendars>=4.13",
  "sounddevice>=0.5",
  # QuantLab idea intake: media decoding (bundled FFmpeg), local speech and text recognition
  "av>=14",
  "pillow>=11",
  "moonshine-cpp==0.1.4",
  "rapidocr>=3.4",
  "faster-whisper>=1.1",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx2",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# prompt prose reads better unwrapped
"jarvis/core/persona.py" = ["E501"]
"jarvis/learning/prompt.py" = ["E501"]
"jarvis/bots/prompt.py" = ["E501"]
# user-facing QuantLab text uses typographic × and −
"jarvis/quantlab/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_quantlab*.py" = ["RUF001", "RUF002", "RUF003"]
"jarvis/ultron/prompts.py" = ["E501"]
"jarvis/quantlab/futures/architect.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"jarvis/quantlab/ideas/agents.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"jarvis/ultron/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["av", "av.*", "moonshine_cpp", "moonshine_cpp.*", "rapidocr", "rapidocr.*", "faster_whisper", "faster_whisper.*", "huggingface_hub", "huggingface_hub.*", "aiosqlite.*", "Quartz", "Quartz.*", "AppKit", "AppKit.*", "onnxruntime", "onnxruntime.*", "sounddevice", "sklearn", "sklearn.*", "threadpoolctl", "pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "keyring", "keyring.*", "databento", "databento.*", "databento_dbn", "databento_dbn.*", "pandas", "pandas.*"]
ignore_missing_imports = true
