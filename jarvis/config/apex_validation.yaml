# JARVIS APEX — pre-registered validation criteria (docs/APEX_VALIDATION_PROTOCOL.md).
#
# Registered 2026-10-28, BEFORE any holdout of any APEX strategy was evaluated (no real market
# data had been analysed yet). Changing a number here is a new protocol version: bump
# `protocol_version`; earlier verdicts keep the version they were judged with.
#
# 1.1.0 (2026-10-28, before the first run of any version): the embargo covers a strategy's
#   whole label horizon (entry validity + maximum hold, up to 720 minutes for zone_reaction),
#   not only the maximum hold — 1.0.0 would have let dev labels overlap the next fold and the
#   holdout. No run ever used 1.0.0.
#
# 1.2.0 (2026-10-28, before any run on real data — none was possible: no market data had been
#   imported): adds the trade-success probability head (section `probability`) for the zone
#   setups sweep_reclaim / rejection_rotation / breakout_retest. The 1.1.0 numbers are unchanged.
#   A plan qualifies only with a VALIDATED head, P(TP before SL) >= 0.70, the lower bound of its
#   reliability tenth >= 0.60 and an effective sample >= 30 there (apex/eligibility.py).
protocol_version: "1.2.0"

split:
  warmup_days: 21          # first days only feed zones / base rates, no decisions
  holdout_share: 0.20      # the last 20 % of the available days at the first run — then frozen
  folds: 4                 # chronological walk-forward folds over the development window
  embargo_minutes: 480     # at least; the strategy's label horizon (validity + max hold) when
                           # longer. Decisions this close to a fold end or the holdout are
                           # dropped, so no outcome window overlaps the next period.

evidence:
  min_dev_trades: 60       # filled trades over all development folds
  min_holdout_trades: 30
  min_trade_days: 20       # distinct days with a filled trade (effective sample size)
  bootstrap_resamples: 2000
  baseline_runs: 200       # random-direction / random-time baseline repetitions
  alpha: 0.05              # before the multiple-testing correction (divided by the trial count)

pass:                       # ALL must hold on the development folds before the holdout is opened
  dev_mean_r_ci_low_above: 0.0     # day-block bootstrap 95 % CI of mean R (net) above 0
  beats_baseline: true             # baseline p-value < alpha / trials of this strategy family
  cost_stress_factor: 1.5          # mean R still > 0 with 1.5x costs
  neighbours_positive_share: 0.66  # share of one-step parameter neighbours with mean R > 0
  folds_positive_share: 0.75       # share of folds with mean R > 0
holdout:                    # opened once per strategy version and data source
  mean_r_above: 0.0
  ci_low_above: 0.0

forward:                    # paper journal (real data, not replays)
  min_trades: 30
  ci_low_above: 0.0

neighbours:                 # one parameter at a time, the others at their registered values
  min_rr: [1.25, 1.75]
  reach_atr: [2.0, 4.0]
  stop_buffer_atr: [0.10, 0.20]

probability:                # P(TP before SL after the fill) — fitted inside the development window
  fit_share: 0.60           # first 60 % of the development window's time: L2 logistic regression
  calibration_share: 0.20   # next 20 %: Platt scaling only; the last 20 %: graded once (test)
  min_fit: 60               # filled trades per window, below → INSUFFICIENT_DATA, no model
  min_calibration: 30
  min_test: 30
  min_effective: 30         # effective test sample (trades of a day are dependent)
  max_slope_error: 0.30     # calibration slope on the test window within 1 ± 0.30
  max_mean_gap: 0.05        # |mean predicted − observed win rate| on the test window
  permutation_runs: 20      # label shuffles: the real Brier skill must beat their 95th percentile
