# Model providers.
#
# fast       routine turns: conversation, tool use, simple planning
# reasoning  explicit THINK mode ("think: …" / "denk nach: …")
#
# Commands the rule router understands ("open safari", "system status")
# never call a model at all.
#
# The API key comes from the environment or jarvis/.env only:
#   ANTHROPIC_API_KEY=sk-ant-…
# Never put keys in this file.

fast:
  provider: anthropic
  model: claude-sonnet-5-5
  effort: low            # chat-style turns with light tool use
  max_tokens: 16000
  timeout_seconds: 60

reasoning:
  provider: anthropic
  model: claude-opus-5-5
  effort: high
  max_tokens: 16000
  timeout_seconds: 300

# On a safety-classifier refusal the API re-runs the request on a suitable
# fallback model inside the same call (server-side, "default" routing).
refusal_fallback: true

# Earlier exchanges sent along as plain text (working memory, not long-term memory).
history_turns: 12

# Upper bound of model ↔ tool round-trips in one turn.
max_tool_rounds: 8

vision:
  provider: none
embedding:
  provider: none
speech:
  stt: none
  tts: none
