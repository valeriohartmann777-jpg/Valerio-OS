# Self-directed learning: JARVIS researches scalping and day trading on NQ
# and XAUUSD with historical data. It only learns — no broker, no orders,
# no access to your computer. Start and stop it on the Learning page.
#
# How a round works: Claude reads its notes and earlier results (optionally
# searches the web for ideas), measures how support and resistance behave
# (level studies), writes up to `tests_per_round` strategies in a small rule
# language, JARVIS backtests them, and Claude records what it learned. Only
# results that hold up on data Claude never tuned on count.

model: claude-opus-5-5
effort: medium
max_tokens: 8000          # per model call, thinking included
timeout_seconds: 180

daily_budget_usd: 3.0     # hard limit per calendar day (this Mac's time zone)
round_interval_minutes: 15
# Learning stops itself after this many rounds without a new validated finding.
stall_limit: 20
tests_per_round: 3
studies_per_round: 4      # level studies (support/resistance), in-sample only
max_steps_per_round: 8

# What to research. The Learning page can change it without editing this file.
focus: >-
  Support and resistance on NQ and XAUUSD. Find out which levels actually
  hold: swing pivots, the previous day's and week's high and low, the
  overnight / Asia range, the opening range, round numbers, the previous
  session's point of control and value area, VWAP. How does price react on
  the first touch versus later touches, in which session (London, New York
  open, afternoon), and when does a level break instead of holding? Measure
  with level studies first, then turn what is robust into strategies —
  bounces and breakouts — for scalping and day trading, separately for each
  market.

web_search: true          # Claude's web search for ideas; turns itself off if the key can't use it
searches_per_round: 2
web_search_usd: 0.01      # per search

# USD per million tokens. Check console.anthropic.com → pricing; learning
# refuses to run with a model that has no price here (the budget needs it).
prices:
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write: 5.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}

# History (UTC days, from Dukascopy's free data API: jetta.dukascopy.com).
# Claude sees full results only for in-sample tests; the
# out-of-sample period answers pass/fail; the holdout is never shown to Claude
# and only confirms findings for you.
data_start: 2021-01-01
oos_start: 2024-01-01
holdout_start: 2025-04-01

instruments:
  NQ:
    # Dukascopy's USA Tech 100 CFD (the cash Nasdaq-100): intraday moves track
    # the NQ future; prices differ by the futures basis and volume is
    # Dukascopy's quote volume, not exchange volume.
    symbol: USATECHIDXUSD
    code: USATECH.IDX-USD  # the data API's name (checked against Dukascopy's instrument list)
    label: Nasdaq-100 (NQ) — Dukascopy USA Tech 100 CFD, bid prices
    price_range: [4000, 39000]
    cost_points: 1.0       # NQ round trip: ~0.2 commission + ~0.8 spread/slippage
    min_stop_points: 3.0
    point_value_usd: 20
  XAUUSD:
    symbol: XAUUSD
    code: XAU-USD
    label: Gold spot (XAUUSD) — Dukascopy, bid prices
    price_range: [900, 8900]
    cost_points: 0.40      # spread + slippage per round trip, in USD per ounce
    min_stop_points: 0.8
    point_value_usd: 100   # per standard lot (100 oz)

gates:
  min_trades: {scalping: 150, daytrading: 60}       # in-sample
  min_oos_trades: {scalping: 50, daytrading: 25}
  in_sample_min_avg_r: 0.05
  in_sample_min_profit_factor: 1.1
  in_sample_min_t: 2.0
  oos_min_profit_factor: 1.05
  # The out-of-sample bar rises with every out-of-sample evaluation
  # (Bonferroni at this family-wise error rate), so testing many ideas can't
  # produce "findings" by luck.
  oos_alpha: 0.05
